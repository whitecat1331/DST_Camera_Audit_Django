name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production-use
        run: python manage.py check
      - name: Django tests
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production-use
        run: python manage.py test
